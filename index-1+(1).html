<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نام شما | لینک‌ها</title>
  <meta name="description" content="همه‌ی لینک‌های من در یک صفحه.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">

    <!-- پروفایل: اگه عکس داری، به‌جای span یک <img src="me.jpg" alt="..."> بذار -->
    <header class="profile">
      <span class="avatar" aria-hidden="true">ن</span>
      <h1>نام شما</h1>
      <p>یک جمله درباره‌ی اینکه چه کاری انجام می‌دهید.</p>
    </header>

    <!-- لینک‌ها: هر <li> یک دکمه است. کپی کن و آدرس و متن رو عوض کن -->
    <ul class="links">
      <li>
        <a href="https://youtube.com/@USERNAME">
          <span class="label">کانال یوتیوب</span>
          <span class="tag">YouTube</span>
        </a>
      </li>
      <li>
        <a href="https://instagram.com/USERNAME">
          <span class="label">صفحه‌ی اینستاگرام</span>
          <span class="tag">Instagram</span>
        </a>
      </li>
      <li>
        <a href="https://github.com/USERNAME">
          <span class="label">پروژه‌ها در گیتهاب</span>
          <span class="tag">GitHub</span>
        </a>
      </li>
      <li>
        <a href="https://t.me/USERNAME">
          <span class="label">کانال تلگرام</span>
          <span class="tag">Telegram</span>
        </a>
      </li>
      <li>
        <a href="mailto:you@example.com">
          <span class="label">ارسال ایمیل</span>
          <span class="tag">Email</span>
        </a>
      </li>
    </ul>

    <footer>
      <p>© نام شما</p>
    </footer>

  </main>

</body>
</html>
